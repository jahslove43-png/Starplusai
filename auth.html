<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>StarPlusAI — Account</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="site-header"><a class="logo" href="index.html">StarPlusAI</a><div class="header-actions"><a class="nav-button" href="index.html">Back to website</a></div></header>
<main class="auth-shell"><section class="auth-card"><span class="eyebrow">StarPlusAI account</span><h1 id="title">Create your account</h1><p id="subtitle">Start your 3-day free trial and manage your customer reviews.</p>
<form id="authForm" class="auth-form"><label id="nameLabel">Business name<input id="businessName" autocomplete="organization" required></label><label>Email<input id="email" type="email" autocomplete="email" required></label><label>Password<input id="password" type="password" minlength="8" autocomplete="new-password" required></label>
<label id="confirmPasswordLabel">Confirm password<input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></label>
<div id="signupChecks" class="signup-checks hidden" aria-live="polite">
  <div data-check="business"><span>✓</span> Business name is provided</div>
  <div data-check="email"><span>✓</span> Email format is valid</div>
  <div data-check="password"><span>✓</span> Password meets the security requirements</div>
  <div data-check="match"><span>✓</span> Passwords match</div>
</div>
<div id="turnstileWidget" class="cf-turnstile turnstile-widget" data-sitekey="0x4AAAAAAFFE1nC5af_a6XmH" data-theme="light" data-size="flexible" data-callback="onTurnstileSuccess" data-expired-callback="onTurnstileExpired" data-error-callback="onTurnstileError" aria-label="Security verification"></div>
<button class="button primary full" id="submitButton" type="submit">Create account</button></form>
<div class="auth-links"><button class="text-button" id="toggleMode" type="button">Already have an account? Log in</button><button class="text-button hidden" id="forgot" type="button">Forgot your password?</button><button class="text-button hidden" id="resendVerification" type="button">Resend verification email</button></div></section></main><div id="toast" class="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script><script>
const SUPABASE_URL="https://rxebfyhoojuyasddkqyr.supabase.co";
const SUPABASE_KEY="sb_publishable_LUBsZv3T2XUey0jZ5BI4vw_6shsxEfg";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let mode="signup";
let turnstileToken="";
let turnstileWidgetId=null;
window.onTurnstileSuccess=(token)=>{turnstileToken=token};
window.onTurnstileExpired=()=>{turnstileToken=""};
window.onTurnstileError=()=>{turnstileToken=""};
function renderTurnstile(){return}

const form=document.getElementById("authForm"), nameInput=document.getElementById("businessName"), nameLabel=document.getElementById("nameLabel"), confirmPassword=document.getElementById("confirmPassword"), confirmPasswordLabel=document.getElementById("confirmPasswordLabel"), checks=document.getElementById("signupChecks"), title=document.getElementById("title"), subtitle=document.getElementById("subtitle"), submit=document.getElementById("submitButton"), toggle=document.getElementById("toggleMode"), forgot=document.getElementById("forgot"), resendVerification=document.getElementById("resendVerification"), toast=document.getElementById("toast");
function notify(msg,type="success"){toast.textContent=msg;toast.className="toast show "+type;setTimeout(()=>toast.className="toast",4500)}
function render(){const signup=mode==="signup";title.textContent=signup?"Create your account":"Welcome back";subtitle.textContent=signup?"Start your 7-day free trial and manage your customer reviews.":"Log in to continue to your StarPlusAI dashboard.";nameLabel.classList.toggle("hidden",!signup);nameInput.required=signup;nameInput.disabled=!signup;nameInput.value=signup?nameInput.value:"";confirmPasswordLabel.classList.toggle("hidden",!signup);confirmPassword.required=signup;confirmPassword.disabled=!signup;confirmPassword.value=signup?confirmPassword.value:"";checks.classList.toggle("hidden",!signup);document.getElementById("password").autocomplete=signup?"new-password":"current-password";submit.textContent=signup?"Create account":"Log in";toggle.textContent=signup?"Already have an account? Log in":"Need an account? Create one";forgot.classList.toggle("hidden",signup);resendVerification.classList.toggle("hidden",signup)}
toggle.onclick=()=>{mode=mode==="signup"?"login":"signup";render()};

resendVerification.onclick=async()=>{const email=document.getElementById("email").value.trim();if(!email)return notify("Enter your email first.","error");const {error}=await client.auth.resend({type:"signup",email,options:{emailRedirectTo:"https://starplussai.netlify.app/app.html"}});if(error)notify(error.message,"error");else notify("A new verification email has been sent.");};
forgot.onclick=async()=>{const email=document.getElementById("email").value.trim();if(!email)return notify("Enter your email first.","error");if(!turnstileToken)return notify("Complete the security verification first.","error");const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:"https://starplussai.netlify.app/app.html",captchaToken:turnstileToken});if(error)notify(error.message,"error");else notify("Password reset instructions sent to your email.")};
function updateChecks(){if(mode!=="signup")return;const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value,match=confirmPassword.value===password&&password.length>0;document.querySelector('[data-check="business"]').classList.toggle("ok",nameInput.value.trim().length>=2);document.querySelector('[data-check="email"]').classList.toggle("ok",/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email));document.querySelector('[data-check="password"]').classList.toggle("ok",password.length>=8);document.querySelector('[data-check="match"]').classList.toggle("ok",match)}
[nameInput,document.getElementById("email"),document.getElementById("password"),confirmPassword].forEach(el=>el.addEventListener("input",updateChecks));
form.onsubmit=async(e)=>{e.preventDefault();if(mode==="signup"){updateChecks();const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value,businessName=nameInput.value.trim();if(businessName.length<2)return notify("Enter your business name.","error");
if(!turnstileToken)return notify("Complete the security verification first.","error");if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return notify("Enter a valid email address.","error");if(password.length<8)return notify("Password must be at least 8 characters.","error");if(password!==confirmPassword.value)return notify("Passwords do not match.","error");submit.disabled=true;try{const {data,error}=await client.auth.signUp({email,password,options:{emailRedirectTo:"https://starplussai.netlify.app/app.html",captchaToken:turnstileToken,data:{business_name:businessName}}});if(error)throw error;if(!data.user)throw new Error("Account could not be created.");const {error:profileError}=await client.from("businesses").upsert({id:data.user.id,name:businessName,email,plan:"trial",subscription_status:"trial",trial_ends_at:new Date(Date.now()+3*24*60*60*1000).toISOString()},{onConflict:"id"});if(profileError)throw profileError;if(data.session){notify("Account created. Opening your dashboard.");setTimeout(()=>location.href="app.html",500)}else{notify("Account created. Check your email to verify your account.");mode="login";render()}}catch(err){notify(err.message||"Something went wrong.","error")}finally{submit.disabled=false;if(window.turnstile&&turnstileWidgetId!==null){turnstileToken="";window.turnstile.reset(turnstileWidgetId)}}return}submit.disabled=true;try{const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
if(!turnstileToken)return notify("Complete the security verification first.","error");
const {data,error}=await client.auth.signInWithPassword({email,password,captchaToken:turnstileToken});if(error)throw error;notify("Login successful. Opening your dashboard.");setTimeout(()=>location.href="app.html",300)}catch(err){notify(err.message||"Login failed.","error");if(mode==="login" && /confirm|verified/i.test(err.message||""))resendVerification.classList.remove("hidden")}finally{submit.disabled=false;if(window.turnstile&&turnstileWidgetId!==null){turnstileToken="";window.turnstile.reset(turnstileWidgetId)}}};
(async()=>{const {data}=await client.auth.getSession();if(data.session){location.replace("app.html");return}document.querySelector(".header-actions").insertAdjacentHTML("beforeend",'<a class="nav-button" href="app.html">Dashboard</a>')})();render();
</script></body></html>
