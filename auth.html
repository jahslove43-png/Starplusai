<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>StarPlusAI — Create your account</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="site-header"><a class="logo" href="index.html">StarPlusAI</a><div class="header-actions"><a class="nav-button" href="index.html">Back to website</a></div></header>
<main class="auth-shell"><section class="auth-card"><span class="eyebrow">StarPlusAI account</span><h1 id="title">Create your account</h1><p id="subtitle">Start your 7-day free trial and manage your customer reviews.</p>
<form id="authForm" class="auth-form"><label id="nameLabel">Business name<input id="businessName" autocomplete="organization" required></label><label>Email<input id="email" type="email" autocomplete="email" required></label><label>Password<input id="password" type="password" minlength="6" autocomplete="new-password" required></label><button class="button primary full" id="submitButton" type="submit">Create account</button></form>
<div class="auth-links"><button class="text-button" id="toggleMode" type="button">Already have an account? Log in</button><button class="text-button hidden" id="forgot" type="button">Forgot your password?</button></div></section></main><div id="toast" class="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://rxebfyhoojuyasddkqyr.supabase.co";
const SUPABASE_KEY="sb_publishable_LUBsZv3T2XUey0jZ5BI4vw_6shsxEfg";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let mode="signup";
const form=document.getElementById("authForm"), nameInput=document.getElementById("businessName"), nameLabel=document.getElementById("nameLabel"), title=document.getElementById("title"), subtitle=document.getElementById("subtitle"), submit=document.getElementById("submitButton"), toggle=document.getElementById("toggleMode"), forgot=document.getElementById("forgot"), toast=document.getElementById("toast");
function notify(msg,type="success"){toast.textContent=msg;toast.className="toast show "+type;setTimeout(()=>toast.className="toast",4500)}
function render(){const signup=mode==="signup";title.textContent=signup?"Create your account":"Welcome back";subtitle.textContent=signup?"Start your 7-day free trial and manage your customer reviews.":"Log in to continue to your StarPlusAI dashboard.";nameLabel.classList.toggle("hidden",!signup);nameInput.required=signup;nameInput.disabled=!signup;nameInput.value=signup?nameInput.value:"";document.getElementById("password").autocomplete=signup?"new-password":"current-password";submit.textContent=signup?"Create account":"Log in";toggle.textContent=signup?"Already have an account? Log in":"Need an account? Create one";forgot.classList.toggle("hidden",signup)}
toggle.onclick=()=>{mode=mode==="signup"?"login":"signup";render()};
forgot.onclick=async()=>{const email=document.getElementById("email").value.trim();if(!email)return notify("Enter your email first.","error");const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)notify(error.message,"error");else notify("Password reset instructions sent to your email.")};
form.onsubmit=async(e)=>{e.preventDefault();submit.disabled=true;try{const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;if(mode==="signup"){const businessName=nameInput.value.trim();const {data,error}=await client.auth.signUp({email,password});if(error)throw error;if(!data.user)throw new Error("Account could not be created.");const {error:profileError}=await client.from("businesses").insert({id:data.user.id,name:businessName,email,plan:"trial",subscription_status:"trial"});if(profileError)throw profileError;notify("Account created. Opening your dashboard.");setTimeout(()=>location.href="app.html",700)}else{const {error}=await client.auth.signInWithPassword({email,password});if(error)throw error;notify("Login successful. Opening your dashboard.");setTimeout(()=>location.href="app.html",500)}}catch(err){notify(err.message||"Something went wrong.","error")}finally{submit.disabled=false}};
(async()=>{const {data}=await client.auth.getSession();if(data.session)document.querySelector(".header-actions").insertAdjacentHTML("beforeend",'<a class="nav-button" href="app.html">Dashboard</a>')})();render();
</script></body></html>
